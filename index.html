<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#b45309">
  <title>Distribuidora de Bebidas — Gestão de Estoque &amp; Vendas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { max-width: 100%; overflow-x: hidden; -webkit-text-size-adjust: 100%; }
    body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    .grid > *, .card { min-width: 0; }
    @media (max-width: 640px) {
      input, select, textarea, .inp { font-size: 16px !important; }
      .btn { white-space: normal; text-align: center; }
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: rgba(120, 113, 108, 0.4); border-radius: 4px; }
    @keyframes laser { 0%,100% { top: 10%; } 50% { top: 85%; } }
    .scanner-laser { animation: laser 2s ease-in-out infinite; }
    @keyframes pulse-border { 0%,100% { box-shadow: 0 0 0 0 rgba(245,158,11,.5); } 50% { box-shadow: 0 0 0 4px rgba(245,158,11,0); } }
    .pulse { animation: pulse-border 2s infinite; }
    .modal-bg { position: fixed; inset: 0; z-index: 50; background: rgba(12,10,9,.7); display: flex; align-items: flex-start; justify-content: center; padding: 1rem; overflow-y: auto; }
    .inp { width: 100%; background: #fafaf9; border: 1px solid #d6d3d1; border-radius: .75rem; padding: .5rem .75rem; font-size: .875rem; outline: none; }
    .inp:focus { border-color: #d97706; box-shadow: 0 0 0 2px rgba(217,119,6,.25); }
    .lbl { display: block; font-size: .7rem; font-weight: 700; color: #57534e; margin-bottom: .25rem; text-transform: uppercase; letter-spacing: .02em; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; font-weight: 700; font-size: .8rem; padding: .55rem .9rem; border-radius: .75rem; cursor: pointer; transition: .15s; border: 1px solid transparent; white-space: nowrap; }
    .btn-pri { background: #d97706; color: #fff; } .btn-pri:hover { background: #b45309; }
    .btn-dark { background: #292524; color: #fff; } .btn-dark:hover { background: #0c0a09; }
    .btn-out { background: #fff; color: #44403c; border-color: #d6d3d1; } .btn-out:hover { background: #f5f5f4; }
    .btn-red { background: #fff1f2; color: #be123c; border-color: #fecdd3; } .btn-red:hover { background: #ffe4e6; }
    .btn-green { background: #ecfdf5; color: #047857; border-color: #a7f3d0; } .btn-green:hover { background: #d1fae5; }
    .btn-sm { padding: .3rem .55rem; font-size: .7rem; border-radius: .5rem; }
    .card { background: #fff; border: 1px solid #e7e5e4; border-radius: 1rem; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    .badge { display: inline-block; padding: .1rem .5rem; font-size: .68rem; font-weight: 700; border-radius: 999px; border: 1px solid; white-space: nowrap; }
    th { text-align: left; font-size: .68rem; text-transform: uppercase; letter-spacing: .03em; color: #78716c; font-weight: 700; padding: .6rem .75rem; background: #fafaf9; border-bottom: 1px solid #e7e5e4; white-space: nowrap; }
    td { padding: .6rem .75rem; border-bottom: 1px solid #f5f5f4; font-size: .82rem; vertical-align: middle; }
    @media print { body * { visibility: hidden; } #print-area, #print-area * { visibility: visible; } #print-area { position: absolute; left: 0; top: 0; width: 100%; } }
  </style>
</head>
<body class="bg-stone-100 text-stone-800 antialiased min-h-screen">
  <div id="login-overlay" class="hidden fixed inset-0 z-[70] bg-stone-900/95 items-center justify-center p-4"></div>
  <div id="app" class="max-w-7xl mx-auto p-3 sm:p-6 space-y-5"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="fixed bottom-4 right-4 z-[80] space-y-2 max-w-sm"></div>
  <script src="/app.js"></script>
</body>
</html>
